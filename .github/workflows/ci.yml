name: Contract, interface and ABI gates
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python -m py_compile contracts/*.py
      - run: node --test tests/*.test.mjs
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npm run schema:studionet
