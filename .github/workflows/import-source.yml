name: One-time source import
on:
  push:
    paths: ['.import/READY']
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate and expand project source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/project-source
          cat .import/part* | base64 -d >/tmp/project-source/source.tar.xz
          echo '3acdbe8bb60fdb8f386627dd455d4e9f21795336132a6f68b8967ea78eeb42bb  /tmp/project-source/source.tar.xz' | sha256sum -c -
          tar -xJf /tmp/project-source/source.tar.xz -C .
          test -f README.md
          test -d contracts
          test -d web
          test -d tests
          rm -rf .import
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: publish full original GenLayer project source'
          git push origin HEAD:main
